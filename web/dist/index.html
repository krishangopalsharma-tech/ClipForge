    <!-- Download all: when clips are on screen, link to a ZIP of them plus a tracking
         CSV. The clip folder id is read from the clips' own URLs (/clips/<id>/<n>.mp4),
         so this needs nothing from the React app. Several generations on screen (the
         Library) link to the CSV of everything instead. -->
    <script>
    (function () {
      "use strict";
      var link = document.getElementById("cf-export-link");
      var label = link && link.querySelector("b");
      var re = /\/clips\/([0-9a-f]{32})\/\d+\.mp4/;
      function ids() {
        var found = {};
        document.querySelectorAll("video, source, a[href]").forEach(function (el) {
          var u = el.getAttribute("src") || el.getAttribute("href") || "";
          var m = re.exec(u);
          if (m) found[m[1]] = true;
        });
        return Object.keys(found);
      }
      function tick() {
        if (!link) return;
        var found = ids();
        if (found.length === 1) {
          link.href = "/api/export/" + found[0];
          label.textContent = "All clips + CSV";
          link.hidden = false;
        } else if (found.length > 1) {
          link.href = "/api/export.csv";
          label.textContent = "CSV of all clips";
          link.hidden = false;
        } else {
          link.hidden = true;
        }
      }
      setInterval(tick, 1500);
      tick();
    })();
    </script>
    <!-- Studio bridge -------------------------------------------------------
         Lets clips chosen in /studio render through THIS page, so the full
         caption / music / effects toolset and the live preview still apply.

         The React bundle POSTs /api/generate with window.fetch, so wrapping
         fetch is enough to append `manual_windows` to the body it already
         built. Nothing about the app's own request is changed otherwise, and
         with no armed clips this is a no-op passthrough. -->
    <div id="cf-armed">
      <span><b id="cf-armed-n">0</b> clip(s) armed <span class="sub" id="cf-armed-src"></span></span>
      <button type="button" id="cf-armed-clear">Clear</button>
    </div>
    <script>
    (function () {
      "use strict";
      var KEY = "cf-armed-clips";

      function read() {
        try {
          var a = JSON.parse(localStorage.getItem(KEY) || "null");
          return a && Array.isArray(a.windows) && a.windows.length ? a : null;
        } catch (_) { return null; }
      }

      function paint() {
        var a = read(), el = document.getElementById("cf-armed");
        if (!el) return;
        if (!a) { el.style.display = "none"; return; }
        el.style.display = "flex";
        document.getElementById("cf-armed-n").textContent = a.windows.length;
        document.getElementById("cf-armed-src").textContent =
          "· " + (a.label || ("video " + String(a.source_id || "").slice(0, 8) + "…")) +
          " · style it, then Generate renders these";
      }

      document.getElementById("cf-armed-clear").onclick = function () {
        localStorage.removeItem(KEY);
        paint();
      };
      // Studio runs in another tab on the same origin; keep the banner honest.
      window.addEventListener("storage", paint);
      window.addEventListener("focus", paint);
      paint();

      // --- auto-adopt the Studio video ----------------------------------
      // The app can take its source either from an upload OR from a file the
      // server already fetched (it previews that one straight from
      // /api/download/<id>/video). The second path is exactly what a Studio
      // video is, so we answer the app's prefetch call ourselves with the id
      // it already has on disk. No bytes move, and the preview still works.
      var MARKER = "https://studio.local/";

      function fakeDone(sourceId) {
        return new Response(JSON.stringify({
          prefetch_id: "studio",
          status: "done",
          download_id: sourceId,
          progress: 1
        }), { status: 200, headers: { "Content-Type": "application/json" } });
      }

      function setReactValue(el, value) {
        // React tracks its own copy of the value, so assigning .value directly
        // is ignored. Go through the native setter, then fire the event React
        // actually listens for.
        var proto = Object.getPrototypeOf(el);
        var setter = Object.getOwnPropertyDescriptor(proto, "value");
        if (setter && setter.set) setter.set.call(el, value);
        else el.value = value;
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      }

      function findLinkInput() {
        var inputs = document.querySelectorAll("input");
        for (var i = 0; i < inputs.length; i++) {
          var ph = (inputs[i].placeholder || "").toLowerCase();
          if (ph.indexOf("link") !== -1 || ph.indexOf("url") !== -1) return inputs[i];
        }
        return null;
      }

      function findGenerateButton() {
        var buttons = document.querySelectorAll("button");
        for (var i = 0; i < buttons.length; i++) {
          if (/generate/i.test(buttons[i].textContent || "")) return buttons[i];
        }
        return null;
      }

      function findClipCountInput() {
        // The clip-count spinner: a 1..100 number input sitting under a "CLIPS"
        // label. Matching on both keeps it apart from the styling spinners.
        var inputs = document.querySelectorAll('input[type="number"][min="1"][max="100"]');
        for (var i = 0; i < inputs.length; i++) {
          var near = inputs[i].closest("div");
          near = near && near.parentElement;
          if (near && /clips/i.test(near.innerText || "")) return inputs[i];
        }
        return null;
      }

      // Keep the visible clip count honest: with clips armed the app renders
      // exactly those, so leaving the spinner on its own number is misleading.
      function syncClipCount(count) {
        var tries = 0;
        var timer = setInterval(function () {
          tries++;
          var input = findClipCountInput();
          if (input) {
            clearInterval(timer);
            if (Number(input.value) !== count) {
              try { setReactValue(input, String(count)); } catch (_) {}
            }
          } else if (tries > 40) {
            clearInterval(timer);
          }
        }, 250);
      }

      function findButton(re) {
        var buttons = document.querySelectorAll("button");
        for (var i = 0; i < buttons.length; i++) {
          if (re.test(buttons[i].textContent || "")) return buttons[i];
        }
        return null;
      }

      // Load a video already in downloads/ into the editor, from wherever the
      // app is: the source screen, or the editor showing another video.
      // `done` runs once the editor has it (or the attempt is given up).
      var loading = 0;   // timestamp of the last load we started, for the start screen
      function loadSource(sourceId, done) {
        loading = Date.now();
        try { localStorage.setItem("cf-last-video", sourceId); } catch (_) {}
        adopt({ source_id: sourceId, windows: [] }, done || function () {});
      }

      function adopt(armed, done) {
        done = done || function () { syncClipCount(armed.windows.length); };
        loading = Date.now();
        var tries = 0, backed = false;
        var timer = setInterval(function () {
          tries++;
          var input = findLinkInput();
          // Already in the editor with another video? The link box lives on
          // the source screen, so step back there first (once).
          if (!input && !backed) {
            var back = findButton(/back to source/i);
            if (back) { backed = true; back.click(); return; }
          }
          var button = input ? findGenerateButton() : null;
          if (input && button) {
            clearInterval(timer);
            try {
              setReactValue(input, MARKER + armed.source_id);
              // Straight after "Back to source" the screen is still settling
              // and a click can be lost. Keep the link filled in and click
              // again while the link box is still on screen (the editor has
              // none), at most a few times.
              var clicks = 0, ticks = 0;
              setTimeout(function press() {
                var box = findLinkInput(), b = findGenerateButton();
                if (!box || !b || clicks >= 5 || ++ticks > 20) {
                  done();
                  return;
                }
                if (box.value !== MARKER + armed.source_id) {
                  setReactValue(box, MARKER + armed.source_id);
                } else if (!b.disabled) {
                  clicks++;
                  b.click();
                }
                setTimeout(press, 700);
              }, 150);
            } catch (err) {
              console.warn("Studio auto-load failed; load the video yourself.", err);
            }
          } else if (tries > 40) {          // ~8s, then give up quietly
            clearInterval(timer);
          }
        }, 200);
      }

      var nativeFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        var url = typeof input === "string" ? input : (input && input.url) || "";
        var method = ((init && init.method) || (input && input.method) || "GET").toUpperCase();

        // Answer the prefetch for a Studio video locally — the file is already
        // in downloads/, so there is nothing to fetch.
        if (method === "POST" && url.indexOf("/api/prefetch") !== -1 && init && init.body) {
          try {
            var pf = JSON.parse(init.body);
            var marked = String(pf.video_url || "");
            if (marked.indexOf(MARKER) === 0) {
              // The id is in the marker itself, so this works for a video
              // picked from "Your videos" as well as one sent from Studio.
              var picked = marked.slice(MARKER.length);
              if (/^[0-9a-f]{32}$/.test(picked)) {
                return Promise.resolve(fakeDone(picked));
              }
              var armedNow = read();
              if (armedNow) return Promise.resolve(fakeDone(armedNow.source_id));
            }
          } catch (_) { /* not ours — fall through */ }
        }

        if (method !== "POST" || url.indexOf("/api/generate") === -1 || !init || !init.body) {
          return nativeFetch(input, init);
        }

        var armed = read();
        if (!armed) return nativeFetch(input, init);

        var body;
        try { body = JSON.parse(init.body); } catch (_) { return nativeFetch(input, init); }

        // Only inject when this really is the video the clips were chosen from —
        // otherwise the timings would point into a different timeline.
        var source = body.upload_id || body.download_id || "";
        if (source && source !== armed.source_id) {
          var go = window.confirm(
            "The armed Studio clips belong to a different video.\n\n" +
            "OK — ignore them and let ClipForge pick clips automatically.\n" +
            "Cancel — stop, so you can load the matching video first."
          );
          if (!go) return Promise.reject(new Error("Cancelled: armed Studio clips are for another video."));
          return nativeFetch(input, init);
        }

        body.manual_windows = armed.windows.map(function (w) {
          return {
            start: w.start,
            end: w.end,
            title: w.title,
            reason: w.reason,
            climax_seg: w.climax_seg,
            climax_time: w.climax_time,
            characters: w.characters,
            speaker_segments: w.speaker_segments,
            punchline_words: w.punchline_words,
          };
        });
        // Studio wants the flash outro; a movie short is already finished
        // and says so by sending flash_outro: false.
        body.flash_outro = armed.flash_outro !== false;
        var next = Object.assign({}, init, { body: JSON.stringify(body) });
        return nativeFetch(input, next);
      };

      // --- "Your videos" ------------------------------------------------
      // Loading a film again means uploading gigabytes a second time, when the
      // file is already in downloads/. Picking one here feeds the app the same
      // marker URL Studio uses, so it adopts the video without moving bytes.
      (function () {
        var btn = document.getElementById("cf-recent-btn");
        var panel = document.getElementById("cf-recent");
        var list = document.getElementById("cf-recent-list");
        if (!btn || !panel || !list) return;
        var loaded = false;

        function size(bytes) {
          var gb = bytes / 1073741824;
          return gb >= 1 ? gb.toFixed(1) + " GB" : Math.round(bytes / 1048576) + " MB";
        }

        function load() {
          fetch("/api/videos").then(function (r) { return r.json(); }).then(function (d) {
            var videos = (d && d.videos) || [];
            if (!videos.length) {
              list.innerHTML = '<p class="cf-note">Nothing uploaded yet. ' +
                'Upload a video and it will be listed here next time.</p>';
              return;
            }
            list.innerHTML = "";
            videos.forEach(function (v) {
              var row = document.createElement("button");
              row.type = "button";
              row.className = "cf-row";
              var name = document.createElement("b");
              name.textContent = v.label || ("Video " + v.source_id.slice(0, 8));
              var meta = document.createElement("span");
              meta.textContent = new Date(v.modified * 1000).toLocaleString() +
                " · " + size(v.bytes) + " · ";
              var tr = document.createElement(v.has_transcript ? "em" : "span");
              tr.textContent = v.has_transcript ? "transcribed" : "not transcribed yet";
              meta.appendChild(tr);
              row.appendChild(name);
              row.appendChild(meta);
              row.onclick = function () { pick(v); };
              list.appendChild(row);
            });
          }).catch(function () {
            list.innerHTML = '<p class="cf-note">Could not read your videos.</p>';
          });
        }

        function pick(video) {
          panel.hidden = true;
          loadSource(video.source_id);
        }

        btn.onclick = function () {
          panel.hidden = !panel.hidden;
          if (!panel.hidden) { load(); loaded = true; }
        };
        document.getElementById("cf-recent-close").onclick = function () {
          panel.hidden = true;
        };
        // Reopening after an upload should show the new file.
        window.addEventListener("focus", function () {
          if (loaded && !panel.hidden) load();
        });
      })();

      // --- In-app panel: Studio / Movie Shorts / Storage --------------------
      // Each tool is its own page, loaded once into an iframe that is only
      // hidden, never destroyed, when you go back to the editor. So a Movie
      // Shorts list, a Studio transcript or a running render is still there
      // when you come back. Handing clips over is a postMessage from the tool,
      // not a page change.
      (function () {
        var panel = document.getElementById("cf-panel");
        var body = document.getElementById("cf-panel-body");
        if (!panel || !body) return;
        var URLS = { studio: "/studio", movie: "/movie", storage: "/storage" };
        var frames = {};

        function show(tool) {
          if (!URLS[tool]) tool = "studio";
          if (!frames[tool]) {
            var f = document.createElement("iframe");
            f.src = URLS[tool];
            f.title = tool;
            body.appendChild(f);
            frames[tool] = f;
          }
          Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== tool; });
          panel.querySelectorAll(".cf-tab").forEach(function (t) {
            t.setAttribute("aria-selected", t.getAttribute("data-tool") === tool ? "true" : "false");
          });
          panel.hidden = false;
          document.documentElement.style.overflow = "hidden";
          try { history.replaceState(null, "", "#" + tool); } catch (_) {}
        }

        function hide() {
          panel.hidden = true;
          document.documentElement.style.overflow = "";
          try { history.replaceState(null, "", location.pathname + location.search); } catch (_) {}
        }

        panel.querySelectorAll(".cf-tab").forEach(function (t) {
          t.onclick = function () { show(t.getAttribute("data-tool")); };
        });
        document.getElementById("cf-panel-back").onclick = hide;
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && !panel.hidden) hide();
        });

        // The floating links open the panel; their href still works as a
        // normal link (middle-click, new tab).
        [["cf-studio-link", "studio"], ["cf-movie-link", "movie"], ["cf-storage-link", "storage"]]
          .forEach(function (pair) {
            var a = document.getElementById(pair[0]);
            if (!a) return;
            a.addEventListener("click", function (e) {
              if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
              e.preventDefault();
              show(pair[1]);
            });
          });

        // One tool asks for another: Movie Shorts' "Edit all" opens Studio's
        // batch editor on that batch. The message waits for Studio to load.
        window.addEventListener("message", function (e) {
          if (e.origin !== location.origin || !e.data || e.data.type !== "cf-open") return;
          if (!URLS[e.data.tool]) return;
          var fresh = !frames[e.data.tool];
          show(e.data.tool);
          if (!e.data.edit_all) return;
          var f = frames[e.data.tool];
          var send = function () {
            f.contentWindow.postMessage({ type: "cf-edit-all", clip_id: e.data.edit_all }, location.origin);
          };
          if (fresh) f.addEventListener("load", send, { once: true });
          else send();
        });

        // A tool armed clips and wants them in the editor now.
        window.addEventListener("message", function (e) {
          if (e.origin !== location.origin) return;
          if (!e.data || e.data.type !== "cf-armed") return;
          hide();
          paint();
          var armed = read();
          if (!armed) return;
          if (armed.adopt) {
            armed.adopt = false;
            try { localStorage.setItem(KEY, JSON.stringify(armed)); } catch (_) {}
            adopt(armed);
          } else {
            syncClipCount(armed.windows.length);
          }
        });

        // /#studio, /#movie, /#storage open straight into that tool.
        var start = (location.hash || "").slice(1);
        if (URLS[start]) show(start);
      })();

      // --- Start screen: straight to the editor --------------------------
      // The app's own first screen asks for a YouTube link. Everything here is
      // worked on from videos already on disk, so that screen is covered by a
      // list of them, and the last video you worked on reopens by itself when
      // its transcript is ready (so opening it costs nothing). The landing page
      // is still underneath: loading a video is done through it, as before.
      (function () {
        var screen = document.getElementById("cf-start");
        var list = document.getElementById("cf-start-list");
        var status = document.getElementById("cf-start-status");
        if (!screen || !list) return;
        var LAST = "cf-last-video";
        var videos = null, uploading = false;

        function last() {
          try { return localStorage.getItem(LAST) || ""; } catch (_) { return ""; }
        }
        function size(bytes) {
          var gb = bytes / 1073741824;
          return gb >= 1 ? gb.toFixed(1) + " GB" : Math.round(bytes / 1048576) + " MB";
        }
        function say(text) { status.textContent = text || ""; }

        function open(v) {
          say("Opening " + (v.label || "video") + "…");
          loadSource(v.source_id);
        }

        function render() {
          list.innerHTML = "";
          if (!videos.length) {
            list.innerHTML = '<p class="note">No videos yet. Upload one to get started.</p>';
            return;
          }
          var lastId = last();
          videos.forEach(function (v) {
            var row = document.createElement("button");
            row.type = "button";
            row.className = "vid" + (v.source_id === lastId ? " last" : "");
            var name = document.createElement("b");
            name.textContent = v.label || ("Video " + v.source_id.slice(0, 8));
            var meta = document.createElement("span");
            meta.textContent = new Date(v.modified * 1000).toLocaleString() + " · " + size(v.bytes);
            var tr = document.createElement("span");
            var tag = document.createElement(v.has_transcript ? "em" : "i");
            tag.textContent = v.has_transcript
              ? (v.source_id === lastId ? "last opened · transcribed" : "transcribed")
              : "not transcribed yet — opening runs Whisper first";
            tr.appendChild(tag);
            row.appendChild(name);
            row.appendChild(meta);
            row.appendChild(tr);
            row.onclick = function () { open(v); };
            list.appendChild(row);
          });
        }

        function load(then) {
          fetch("/api/videos").then(function (r) { return r.json(); }).then(function (d) {
            videos = (d && d.videos) || [];
            render();
            if (then) then();
          }).catch(function () {
            list.innerHTML = '<p class="note">Could not read your videos.</p>';
          });
        }

        // Upload goes through the app's own Upload control, so its progress
        // and transcription work as before; we only show a line about it.
        document.getElementById("cf-start-upload").onclick = function () {
          var file = document.querySelector('input[type="file"]');
          if (!file) { say("The page is still loading — try again in a moment."); return; }
          file.addEventListener("change", function onPick() {
            file.removeEventListener("change", onPick);
            if (file.files && file.files.length) {
              uploading = true;
              say("Uploading " + file.files[0].name + "… it opens in the editor when done.");
            }
          });
          file.click();
        };
        document.getElementById("cf-start-refresh").onclick = function () { load(); };

        // Show the list whenever the app is on its landing page (it has the
        // link box and no video yet); hide it as soon as the editor is up.
        function onLanding() { return !!findLinkInput() && !document.querySelector("video"); }
        var wasLanding = null;
        setInterval(function () {
          var landing = onLanding();
          screen.hidden = !landing;
          if (landing && wasLanding === false) {    // came back via "Back to source"
            uploading = false;
            say("");
            load();
          }
          if (!landing) {
            uploading = false;
            // Remember what is open, uploads included, for next time.
            var v = document.querySelector("video");
            var m = v && /\/([0-9a-f]{32})(?:\/|\.|$)/.exec(v.currentSrc || v.src || "");
            if (m) { try { localStorage.setItem(LAST, m[1]); } catch (_) {} }
          } else if (!uploading && loading && Date.now() - loading > 20000 && status.textContent) {
            say("That video did not open. Try again, or pick another.");
            loading = 0;
          }
          wasLanding = landing;
        }, 400);

        // First visit of this page load: reopen the last video if it is ready.
        // Skipped when Studio or Movie Shorts just sent something (that wins).
        var armed = read();
        var handoff = armed && armed.adopt;
        load(function () {
          if (handoff || !onLanding()) return;
          var id = last();
          var v = null;
          for (var i = 0; i < videos.length; i++) if (videos[i].source_id === id) v = videos[i];
          if (v && v.has_transcript) open(v);
        });
      })();

      // Run last, once everything above is defined. Studio sets `adopt` when it
      // sends you here, so the video loads itself; the flag is consumed once, so
      // coming back later does not re-trigger it.
      var armedOnLoad = read();
      if (armedOnLoad) {
        if (armedOnLoad.adopt) {
          armedOnLoad.adopt = false;
          try { localStorage.setItem(KEY, JSON.stringify(armedOnLoad)); } catch (_) {}
          adopt(armedOnLoad);
        } else {
          syncClipCount(armedOnLoad.windows.length);
        }
      }
    })();
    </script>
  </body>
</html>
